<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蜜桃玩具箱 · 怪奇玩具习作</title>
<style>
  :root {
    --peach: #FFE3C2;
    --peach-deep: #FFD1A1;
    --ink: #5A3A2E;
    --red: #D96C4F;
    --cream: #FFF6E9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--peach); color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh; padding: 40px 56px; position: relative; overflow: hidden;
  }
  .peach {
    position: absolute; font-size: 130px; right: 60px; top: 26px;
    transform: rotate(14deg); user-select: none;
    filter: drop-shadow(6px 8px 0 rgba(90, 58, 46, 0.18));
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .peach:hover { transform: rotate(-10deg) scale(1.12); }
  h1 { font-size: 46px; letter-spacing: 0.04em; margin-top: 18px; }
  .sub { font-size: 15.5px; color: var(--ink); opacity: 0.75; margin-top: 10px; font-style: italic; }
  .bigbtn {
    margin-top: 34px;
    font: inherit; font-size: 19px; font-weight: 700; letter-spacing: 0.12em;
    color: var(--cream); background: var(--red);
    border: 3px solid var(--ink); border-radius: 16px;
    padding: 16px 42px; cursor: pointer; user-select: none;
    box-shadow: 0 8px 0 var(--ink);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .bigbtn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }
  .bubble {
    margin-top: 22px; min-height: 54px; max-width: 34em;
    background: var(--cream); border: 2.5px solid var(--ink); border-radius: 14px;
    padding: 12px 18px; font-size: 15.5px; position: relative;
    opacity: 0; transform: translateY(8px) rotate(-0.5deg);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .bubble.show { opacity: 1; transform: rotate(-0.5deg); }
  .bubble::before {
    content: ""; position: absolute; top: -11px; left: 34px;
    width: 16px; height: 16px; background: var(--cream);
    border-left: 2.5px solid var(--ink); border-top: 2.5px solid var(--ink);
    transform: rotate(45deg);
  }
  .toys { display: flex; gap: 18px; margin-top: 30px; flex-wrap: wrap; }
  .toy {
    flex: 1 1 150px; max-width: 200px;
    background: var(--cream); border: 2.5px solid var(--ink); border-radius: 14px;
    padding: 16px; text-align: center; cursor: pointer;
    box-shadow: 4px 5px 0 rgba(90, 58, 46, 0.25);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .toy:hover { transform: rotate(-2deg) scale(1.05); }
  .toy .e { font-size: 40px; display: block; }
  .toy .n { display: block; margin-top: 8px; font-size: 13px; font-weight: 700; }
  footer {
    position: absolute; left: 56px; right: 56px; bottom: 24px;
    display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink); opacity: 0.7;
    border-top: 2px dashed var(--ink); padding-top: 13px;
  }
  footer a { color: var(--red); text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
  <div class="peach">🍑</div>

  <h1>蜜桃玩具箱</h1>
  <p class="sub">微小的、没用的、令人快乐的东西。</p>

  <button class="bigbtn" id="dont">不要按这个按钮</button>
  <div class="bubble" id="bubble">……按钮在等你。</div>

  <div class="toys" id="toys">
    <div class="toy"><span class="e">🌴</span><span class="n">会打盹的棕榈</span></div>
    <div class="toy"><span class="e">🧦</span><span class="n">七只袜子里的那只</span></div>
    <div class="toy"><span class="e">🦑</span><span class="n">鱿鱼（倒着游）</span></div>
    <div class="toy"><span class="e">🐝</span><span class="n">迟到三年的蜜蜂</span></div>
  </div>

  <footer>
    <span>风格习作 · 学其"一本正经的胡说八道"，台词原创</span>
    <span>致敬 <a href="https://meowni.ca/" target="_blank" rel="noopener">meowni.ca</a> · Monica Dinculescu</span>
  </footer>

<script>
  const lines = [
    "🍑 已通知档案管理员：你按了一个按钮。",
    "警告：此按钮毫无用处，但按得很爽。",
    "+1 无意义值。无意义值 +1。",
    "按钮表示：谢谢你，很久没人按过我了。",
    "刚才发生了一次小型的、安全的奇迹。",
    "系统提示：玩具箱里的鱿鱼对此表示羡慕。",
  ];
  const btn = document.getElementById("dont");
  const bubble = document.getElementById("bubble");
  btn.addEventListener("click", () => {
    bubble.textContent = lines[Math.floor(Math.random() * lines.length)];
    bubble.classList.add("show");
  });
  document.querySelectorAll(".toy").forEach((t) => {
    t.addEventListener("click", () => {
      bubble.textContent = "你摸了摸「" + t.querySelector(".n").textContent + "」。它很高兴，但假装没事。";
      bubble.classList.add("show");
    });
  });
</script>
</body>
</html>
