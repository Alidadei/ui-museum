<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蜜桃玩具箱 · 风格习作（致敬 meowni.ca）</title>
<style>
  /* 令牌抓取自 meowni.ca 线上 CSS（2026-09）：
     --paper oklch(0.99 0.004 95)≈#fcfbf4 / --ink oklch(0.23 0.012 270)≈#2b2c33
     强调色会换装：#EC5B87 粉 · #438F64 绿 · #F9B518 黄 · #4BB8DB 蓝 · #ff55ff 品红 · #0000a8 经典蓝
     原站正文就是等宽字体（Roboto Mono）→ 以系统等宽近似；h1 clamp(27px,4vw,36px) */
  :root {
    --paper: #fcfbf4;
    --ink: #2b2c33;
    --accent: #EC5B87;
    --classic: #0000a8;
    --mono: ui-monospace, Consolas, "Roboto Mono", "PingFang SC", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--mono);
    font-size: 16px; line-height: 1.8;
    min-height: 100vh; padding: 36px 56px;
    transition: background 0.4s ease;
  }
  h1 { font-size: clamp(27px, 4vw, 36px); font-weight: 700; letter-spacing: 0.01em; }
  h1 .peach { display: inline-block; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  h1 .peach:hover { transform: rotate(-14deg) scale(1.15); }
  .sub { color: var(--ink); opacity: 0.66; margin-top: 6px; font-size: 14.5px; }
  a { color: var(--classic); text-decoration: underline; text-underline-offset: 3px; }
  .theme {
    margin-top: 26px; display: flex; align-items: center; gap: 12px;
    font-size: 13px; flex-wrap: wrap;
  }
  .theme .dot {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; transition: transform 0.15s ease;
  }
  .theme .dot:hover { transform: scale(1.2); }
  .theme .dot.on { border-color: var(--ink); transform: scale(1.12); }
  .toys { margin-top: 30px; display: flex; flex-direction: column; gap: 14px; max-width: 34em; }
  .toy {
    background: var(--accent-soft, transparent);
    border: 2px solid var(--ink); border-radius: 8px;
    padding: 14px 18px; cursor: pointer; font: inherit; text-align: left;
    color: var(--ink); display: flex; gap: 14px; align-items: center;
    transition: transform 0.15s ease, background 0.3s ease;
  }
  .toy:hover { transform: translate(4px, -2px); }
  .toy:active { transform: translate(2px, 1px); }
  .toy .e { font-size: 28px; font-family: "Segoe UI Emoji", sans-serif; }
  .say {
    margin-top: 26px; font-size: 14px; min-height: 48px; max-width: 34em;
    border-left: 4px solid var(--accent); padding-left: 14px;
    opacity: 0.85; transition: opacity 0.3s;
  }
  footer {
    position: absolute; left: 56px; right: 56px; bottom: 22px;
    display: flex; justify-content: space-between; font-size: 12px; opacity: 0.62;
    flex-wrap: wrap; gap: 6px;
  }
  footer a { color: var(--ink); }
</style>
</head>
<body>
  <h1><span class="peach">🍑</span> 蜜桃玩具箱</h1>
  <p class="sub">// 桌上放着一些微小的、没用的、令人快乐的东西。</p>

  <div class="theme" id="theme">
    <span>换强调色：</span>
    <button class="dot on" style="background:#EC5B87" data-a="#EC5B87" title="粉"></button>
    <button class="dot" style="background:#438F64" data-a="#438F64" title="绿"></button>
    <button class="dot" style="background:#F9B518" data-a="#F9B518" title="黄"></button>
    <button class="dot" style="background:#4BB8DB" data-a="#4BB8DB" title="蓝"></button>
    <button class="dot" style="background:#ff55ff" data-a="#ff55ff" title="品红"></button>
    <button class="dot" style="background:#0000a8" data-a="#0000a8" title="经典蓝"></button>
  </div>

  <div class="toys">
    <button class="toy" type="button"><span class="e">🦑</span><span>鱿鱼，倒着游（它坚持这样是对的）</span></button>
    <button class="toy" type="button"><span class="e">🧦</span><span>七只袜子里的那一只（其余六只仍在调查中）</span></button>
    <button class="toy" type="button"><span class="e">🐝</span><span>迟到三年的蜜蜂（正在补班）</span></button>
    <button class="toy" type="button"><span class="e">🌴</span><span>会打盹的棕榈（午睡权益捍卫者）</span></button>
  </div>

  <p class="say" id="say">// 随便戳一个，它们会一本正经地回应。</p>

  <footer>
    <span>风格习作 · 令牌抓取自原站线上 CSS（近白纸底 oklch(0.99 0.004 95) / 等宽正文 / 换装强调色机制）；台词原创</span>
    <span>致敬 <a href="https://meowni.ca/" target="_blank" rel="noopener">meowni.ca</a> · Monica Dinculescu</span>
  </footer>

<script>
  // 原站的强调色会整页换装——机制照抄
  const root = document.documentElement;
  document.querySelectorAll("#theme .dot").forEach((d) => {
    d.addEventListener("click", () => {
      root.style.setProperty("--accent", d.dataset.a);
      document.querySelectorAll("#theme .dot").forEach((x) => x.classList.remove("on"));
      d.classList.add("on");
    });
  });
  const says = [
    "它轻轻晃了一下，表示收到。",
    "没有任何事情发生。这正是设计意图。",
    "+1 无意义值。无意义值很珍贵。",
    "它假装没看见，但耳朵动了。",
    "档案管理员已被通知，仅此而已。",
  ];
  document.querySelectorAll(".toy").forEach((t) => {
    t.addEventListener("click", () => {
      const say = document.getElementById("say");
      say.textContent = "// " + says[Math.floor(Math.random() * says.length)];
    });
  });
</script>
</body>
</html>
