<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安静的纸面 · 随笔习作</title>
<style>
  :root {
    --paper: #F4EFE4;
    --ink: #2E2A22;
    --faint: #8B8471;
    --hairline: #D8D0BC;
    --rust: #A4552F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Songti SC", serif;
    min-height: 100vh; padding: 64px 96px;
  }
  .top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; letter-spacing: 0.42em; color: var(--faint);
  }
  .top b { color: var(--ink); font-weight: 400; }
  h1 { font-size: 44px; font-weight: 400; letter-spacing: 0.06em; margin-top: 88px; }
  .quote {
    margin-top: 40px; max-width: 24em;
    font-size: 23px; line-height: 1.9; color: var(--ink);
  }
  .quote::before { content: "「"; color: var(--rust); font-size: 30px; }
  .quote::after { content: "」"; color: var(--rust); font-size: 30px; }
  .quote em { font-style: normal; border-bottom: 1px solid var(--rust); padding-bottom: 2px; }
  .essays { margin-top: 72px; max-width: 30em; }
  .essays p.cap { font-size: 11.5px; letter-spacing: 0.4em; color: var(--faint); margin-bottom: 6px; }
  .essays a {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 17px 2px; border-top: 1px solid var(--hairline);
    color: var(--ink); text-decoration: none; font-size: 17.5px;
    transition: padding-left 0.25s ease;
  }
  .essays a:last-child { border-bottom: 1px solid var(--hairline); }
  .essays a:hover { padding-left: 12px; }
  .essays a:hover .t { color: var(--rust); }
  .essays .y { font-size: 12.5px; color: var(--faint); letter-spacing: 0.14em; }
  footer {
    position: absolute; left: 96px; right: 96px; bottom: 40px;
    display: flex; justify-content: space-between; font-size: 12.5px; color: var(--faint);
    letter-spacing: 0.08em;
  }
  footer a { color: var(--rust); text-decoration: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div class="top"><b>随笔 · ESSAYS</b><span>习作 · 一</span></div>

  <h1>安静的纸面</h1>

  <p class="quote">细节不是装饰，<em>细节是语气</em>——一行小字、一条发丝般的分界，都在替你说话。</p>

  <div class="essays">
    <p class="cap">近期 · WRITING</p>
    <a href="#" onclick="return false"><span class="t">留白是一句没有说完的话</span><span class="y">2026</span></a>
    <a href="#" onclick="return false"><span class="t">暖纸的温度计</span><span class="y">2025</span></a>
    <a href="#" onclick="return false"><span class="t">慢一点的设计，快一点的快乐</span><span class="y">2024</span></a>
  </div>

  <footer>
    <span>风格习作 · 学其克制的书卷气，文章与引句皆为此页原创</span>
    <span>致敬 <a href="https://frankchimero.com/" target="_blank" rel="noopener">frankchimero.com</a> · Frank Chimero</span>
  </footer>
</body>
</html>
