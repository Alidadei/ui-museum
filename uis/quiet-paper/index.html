<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安静的纸面 · 风格习作（致敬 frankchimero.com）</title>
<style>
  /* 令牌抓取自 frankchimero.com 线上 styles.css（2026-09）：
     light: bg #eeeeee / text #2f3432 / dim #828b87 / border #d0d6d4 / accent #5e786d
     insignia #232927 / --font-base 14px / Courier 用于标签与代码 */
  :root {
    --bg: #eeeeee;
    --text: #2f3432;
    --dim: #828b87;
    --border: #d0d6d4;
    --accent: #5e786d;
    --insignia: #232927;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; line-height: 1.75;
    min-height: 100vh; padding: 40px 88px;
  }
  .mono { font-family: Courier, "Courier New", monospace; }
  header a {
    font-family: Courier, "Courier New", monospace;
    font-size: 13px; color: var(--text); text-decoration: none;
  }
  header a:hover { color: var(--accent); }
  h1 {
    margin-top: 96px; font-size: 26px; font-weight: 400; letter-spacing: 0.03em;
  }
  .intro { margin-top: 18px; max-width: 36em; color: var(--text); }
  .intro .accent { color: var(--accent); }
  .list { margin-top: 72px; max-width: 34em; }
  .list .cap {
    font-family: Courier, "Courier New", monospace;
    font-size: 12px; color: var(--dim); letter-spacing: 0.08em; margin-bottom: 4px;
  }
  .item {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 13px 0; border-bottom: 1px solid var(--border);
    color: var(--text); text-decoration: none;
    transition: padding-left 0.25s ease;
  }
  .item:hover { padding-left: 10px; }
  .item:hover .t { color: var(--accent); }
  .item .t { font-size: 15.5px; transition: color 0.25s ease; }
  .item .y { font-family: Courier, "Courier New", monospace; font-size: 12px; color: var(--dim); }
  .seal {
    margin-top: 64px; width: 30px; height: 30px; background: var(--insignia);
    border-radius: 3px; display: grid; place-items: center;
    color: #eeeeee; font-size: 14px; font-family: Courier, monospace;
    user-select: none;
  }
  footer {
    position: absolute; left: 88px; right: 88px; bottom: 34px;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-family: Courier, "Courier New", monospace; font-size: 11.5px; color: var(--dim);
  }
  footer a { color: var(--accent); text-decoration: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header><a href="#" onclick="return false">习作 / 纸面</a></header>

  <h1>安静的纸面</h1>
  <p class="intro">这一页几乎什么都没做：一张 <span class="accent">#eeeeee</span> 的纸、十四个像素的正文字号、一根分界线。克制的意思是——把所有想加的动画都忍回去，只留悬停时十像素的谦让。</p>

  <div class="list">
    <p class="cap">WRITING · 近期</p>
    <a class="item" href="#" onclick="return false"><span class="t">留白是一句没有说完的话</span><span class="y">2026</span></a>
    <a class="item" href="#" onclick="return false"><span class="t">灰绿的脾气</span><span class="y">2025</span></a>
    <a class="item" href="#" onclick="return false"><span class="t">等宽字体的诚实</span><span class="y">2024</span></a>
    <a class="item" href="#" onclick="return false"><span class="t">慢一点的设计</span><span class="y">2023</span></a>
  </div>

  <div class="seal" title="习作印">习</div>

  <footer>
    <span>风格习作 · 令牌抓取自原站 styles.css（bg #eeeeee / text #2f3432 / accent #5e786d / base 14px / Courier 标签）；文章原创</span>
    <span>致敬 <a href="https://frankchimero.com/" target="_blank" rel="noopener">frankchimero.com</a> · Frank Chimero</span>
  </footer>
</body>
</html>
